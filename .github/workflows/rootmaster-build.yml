name: ROOT MASTER build

on:
  push:
    paths: ["rootmaster/**", ".github/workflows/rootmaster-build.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rootmaster
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Unit tests (engine)
        run: ./gradlew --no-daemon :engine:test
      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: rootmaster-debug-apk
          path: rootmaster/app/build/outputs/apk/debug/*.apk
