name: Build Android APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: tv-remote } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx expo prebuild --platform android --no-install
      - run: ./gradlew assembleRelease --no-daemon
        working-directory: tv-remote/android
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk TV-Raymond.apk
      - uses: actions/upload-artifact@v4
        with: { name: TV-Raymond-apk, path: tv-remote/TV-Raymond.apk }
      - name: Publish release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest TV-Raymond.apk --title "TV Raymond APK" --notes "Latest build" --target "${{ github.sha }}"
