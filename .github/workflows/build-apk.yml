name: Build Android APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: tv-remote } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx expo prebuild --platform android --no-install
      - run: ./gradlew assembleRelease --no-daemon
        working-directory: tv-remote/android
      - run: cp android/app/build/outputs/apk/release/app-release.apk TV-Raymond.apk
      - uses: actions/upload-artifact@v4
        with: { name: TV-Raymond-apk, path: tv-remote/TV-Raymond.apk }

  # يشغّل التطبيق فعلياً على محاكي أندرويد ويطبع الأخطاء
  smoke:
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: TV-Raymond-apk, path: tv-remote }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          working-directory: tv-remote
          script: bash scripts/smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: smoke-screen, path: tv-remote/screen.png, if-no-files-found: ignore }

  release:
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: TV-Raymond-apk }
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest TV-Raymond.apk --title "TV Raymond APK" --notes "Latest build" --target "${{ github.sha }}"
